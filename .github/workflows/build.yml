name: Build KickCraft (Windows, macOS, Linux)

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: KickCraft-Windows
          path: |
            build/KickCraft_artefacts/Release/VST3
            build/KickCraft_artefacts/Release/Standalone

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal: Apple Silicon + Intel)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Package
        run: |
          cd build/KickCraft_artefacts/Release
          tar -czf "$GITHUB_WORKSPACE/KickCraft-macOS.tar.gz" VST3 AU Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: KickCraft-macOS
          path: KickCraft-macOS.tar.gz

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev libfontconfig1-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Package
        run: |
          cd build/KickCraft_artefacts/Release
          tar -czf "$GITHUB_WORKSPACE/KickCraft-Linux.tar.gz" VST3 Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: KickCraft-Linux
          path: KickCraft-Linux.tar.gz
